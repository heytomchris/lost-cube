<!doctype html>
<!--
  The Lost Cube demo: link previews for this page, then the real page, 404.html, in place, plus a link to the source.
  Previews read this file's tags without running the script. All of this stays here so that 404.html, the file people
  copy, has nothing of the demo's in it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Lost Cube</title>
<meta name="description" content="A 404 page with an isometric cube that rolls after your cursor. One HTML file.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lost Cube">
<meta property="og:title" content="Lost Cube">
<meta property="og:description" content="A 404 page with an isometric cube that rolls after your cursor. One HTML file.">
<meta property="og:url" content="https://heytomchris.github.io/lost-cube/">
<meta property="og:image" content="https://heytomchris.github.io/lost-cube/media/preview.png">
<meta property="og:image:width" content="950">
<meta property="og:image:height" content="497">
<meta property="og:image:alt" content="A small cube with two eyes on a faded grid, with a trail of searched squares behind it">
<meta name="twitter:card" content="summary_large_image">
<script>
  fetch('404.html')
    .then((r) => { if (!r.ok) throw r.status; return r.text(); })
    .then((html) => {
      document.open(); document.write(html); document.close();
      const repo = 'https://github.com/heytomchris/lost-cube';
      const bar = document.querySelector('.bar');
      bar.style.gap = '4px';
      bar.insertAdjacentHTML('afterbegin', `<a class="icon" href="${repo}" aria-label="Source on GitHub" title="Source on GitHub"><svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg></a>`);
      document.querySelector('.button').href = repo;
    })
    .catch(() => location.replace('404.html'));
</script>
</head>
<body>
<noscript><a href="404.html">Lost Cube</a></noscript>
</body>
</html>
