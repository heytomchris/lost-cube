<!doctype html>
<!--
  Lost Cube: a 404 page with a cube that rolls across a fading grid, searching for the missing page.
  One file, no dependencies. Move the pointer (or touch the ground) and it rolls toward it; left alone it wanders.
  Every square it has searched stays faintly marked. https://github.com/heytomchris/lost-cube
  Apache-2.0
-->
<html lang="en" class="intro-wait">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Page not found</title>
<meta name="description" content="This page doesn’t exist.">
<script>
  // The theme the switch picked, set before first paint; `dark` mirrors what is showing, for the switch's icon.
  (() => {
    const root = document.documentElement;
    let picked = null;
    try { picked = localStorage.getItem('lost-cube.theme'); } catch (e) {}
    if (picked === 'light' || picked === 'dark') root.dataset.theme = picked;
    const system = matchMedia('(prefers-color-scheme: dark)');
    const sync = () => root.classList.toggle('dark', root.dataset.theme ? root.dataset.theme === 'dark' : system.matches);
    sync();
    system.addEventListener('change', sync);
  })();
</script>
<style>
  /* Each colour once, light then dark. The page follows the system until the switch picks a theme. */
  :root {
    color-scheme: light dark;
    /* The dark greys share one hue (about 220°) to avoid a sense of purple. */
    --background: light-dark(#ffffff, #131416);
    --label: light-dark(#0b0b0c, #f4f5f7);
    --secondary: light-dark(#6a6a72, #9a9da4);
    --raised: light-dark(#f0f0f3, #212327);
    --line: light-dark(#e4e4e8, #2c2e33);
    --edge: light-dark(#a4a4ac, #4f525a);
    --mid: light-dark(#c6c6cc, #3a3c42);
    --light: light-dark(#87878f, #7f828a);
    --absorb: light-dark(#bcbcc4, #585b63);
    /* The dark cube's shape comes from its faces, so its lines can stay quiet. */
    --face: light-dark(#ffffff, #181a1e);
    /* A searched square loses light in both themes. */
    --mark: light-dark(#f0f0f3, #000000);
  }
  :root[data-theme='light'] { color-scheme: light; }
  :root[data-theme='dark'] { color-scheme: dark; }
  /* Browsers from before 2024 stay light. */
  @supports not (color: light-dark(#000, #fff)) {
    :root { --background: #ffffff; --label: #0b0b0c; --secondary: #6a6a72; --raised: #f0f0f3; --line: #e4e4e8; --edge: #a4a4ac; --mid: #c6c6cc; --light: #87878f; --absorb: #bcbcc4; --face: #ffffff; --mark: #f0f0f3; }
  }

  .bar {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    display: flex;
    z-index: 1;
  }
  .icon {
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: none;
    color: var(--secondary);
    cursor: pointer;
    transition: color 150ms ease, background-color 150ms ease, transform 150ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  .icon:active { transform: scale(0.94); }
  @media (hover: hover) { .icon:hover { color: var(--label); background: var(--raised); } }
  .theme svg { grid-area: 1 / 1; transition: opacity 150ms ease, transform 200ms cubic-bezier(0.19, 1, 0.22, 1); }
  .theme .sun, .dark .theme .moon { opacity: 0; transform: scale(0.6) rotate(-30deg); }
  .dark .theme .sun { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .theme svg { transform: none !important; } }
  * { box-sizing: border-box; }
  html { overflow-x: clip; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    overflow-x: clip;
    background: var(--background);
    color: var(--label);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Segoe UI', sans-serif;
    font-size: 17px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  :focus-visible { outline: 2px solid var(--label); outline-offset: 3px; }

  main {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px 64px;
    text-align: center;
  }

  /* The drawing (16:10) gets what the text and the button (about 310 px) leave of the window's height. On a phone it
     runs past the sides (125%), where the grid has nearly faded: fewer squares, a bigger cube. */
  .cube {
    display: block;
    width: min(125%, clamp(240px, (100svh - 310px) * 1.6, 640px));
    height: auto;
    touch-action: none; /* a finger drag steers the cube instead of scrolling */
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: visible; /* the cube falls in from above the frame */
  }
  .cube :is(path, polygon) { fill: none; stroke-width: 1; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .cube .g { stroke: var(--line); }
  .cube .t { fill: var(--mark); stroke: none; }
  .cube .light .ribbon { fill: var(--light); stroke: none; }
  .cube .trail path { stroke-width: 8px; stroke-linecap: round; }
  .cube .f { fill: var(--face); stroke: var(--mid); }
  .cube .absorb { fill: url(#absorb); stroke: none; }
  #absorb stop { stop-color: var(--absorb); }
  .cube .s { stroke: var(--edge); }
  .cube .e { fill: var(--secondary); }
  .intro-wait .cube { opacity: 0; }

  .code { margin: 8px 0 12px; font-size: 13px; font-weight: 500; letter-spacing: 0.08em; color: var(--secondary); font-variant-numeric: tabular-nums; }
  h1 { margin: 0; max-width: 16em; font-size: clamp(30px, 4.2vw, 40px); line-height: 1.1; font-weight: 600; letter-spacing: -0.03em; text-wrap: balance; }
  .lede { margin: 12px auto 0; max-width: 28em; font-size: 16px; line-height: 1.55; color: var(--secondary); text-wrap: balance; }
  /* The number and the words each hold a fixed width (the hidden text), so nothing moves as the count grows. The line
     is centred for a two-digit count. */
  .count { position: relative; left: -0.3em; display: flex; justify-content: center; align-items: baseline; gap: 0.28em; min-height: 20px; margin: 10px 0 0; font-size: 12px; line-height: 20px; color: var(--secondary); font-variant-numeric: tabular-nums; }
  .num, .noun { display: inline-grid; }
  .num { justify-items: end; }
  .noun { justify-items: start; }
  .num > *, .noun > *, .slot > * { grid-area: 1 / 1; }
  .ghost { visibility: hidden; }
  .digits { display: inline-flex; }
  .slot { display: inline-grid; }

  .button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    margin-top: 28px;
    padding: 0 20px 0 16px; /* the icon's side looks wider than the text's, so it gets less */
    border-radius: 999px;
    background: var(--background);
    color: var(--label);
    box-shadow: inset 0 0 0 1px var(--line), 0 1px 2px rgb(11 11 12 / 0.05);
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 150ms cubic-bezier(0.25, 0.46, 0.45, 0.94), background-color 150ms ease;
  }
  .button:active { transform: scale(0.97); }
  /* A new theme spreads over the old one (`wave`), and the page can still be pressed meanwhile. */
  .wave::view-transition { pointer-events: none; }
  .wave::view-transition-old(root), .wave::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  @property --wave { syntax: '<percentage>'; inherits: false; initial-value: 0%; }
  /* Centres the capitals, not the line box. */
  .button span { text-box: trim-both cap alphabetic; }
  .button svg { transition: transform 150ms ease; }
  @media (hover: hover) {
    .button:hover { background: var(--raised); }
  }
  @media (hover: hover) and (prefers-reduced-motion: no-preference) {
    .button:hover svg { transform: translateX(-2px); }
  }

  /* The text comes in as the cube lands. From 1 %, not 0: it still counts as painted content. */
  main > :not(.cube) { animation: rise 1100ms cubic-bezier(0.19, 1, 0.22, 1) 780ms both; }
  main > .title { animation-delay: 910ms; }
  main > .lede { animation-delay: 1040ms; }
  main > .count, main > .button { animation-delay: 1170ms; }
  .intro-wait main > :not(.cube) { animation-play-state: paused; }
  @keyframes rise { from { opacity: 0.01; filter: blur(6px); transform: translateY(8px); } }
  @keyframes fade { from { opacity: 0.01; } }
  @media (prefers-reduced-motion: reduce) {
    main > :not(.cube) { animation: fade 300ms ease-out both; }
  }
</style>
</head>
<body>
<div class="bar">
<button class="icon theme" type="button" aria-pressed="false" aria-label="Dark theme" title="Dark theme">
  <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
  <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
</div>
<main>
  <svg class="cube" aria-hidden="true">
    <defs>
      <radialGradient id="fade" cx="0.5" cy="0.55" r="0.5"><stop offset="0.25" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
      <mask id="mask"><rect fill="url(#fade)"/></mask>
      <!-- The light fades later than the grid. -->
      <radialGradient id="reach" cx="0.5" cy="0.55" r="0.5"><stop offset="0.72" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
      <mask id="light-mask"><rect fill="url(#reach)"/></mask>
      <mask id="trail" maskUnits="userSpaceOnUse"><g class="trail"></g></mask>
      <!-- Up the cube, from its lowest corner to its highest. -->
      <linearGradient id="absorb" gradientUnits="userSpaceOnUse" x1="0" x2="0"><stop offset="0"/><stop offset="1" stop-opacity="0"/></linearGradient>
    </defs>
    <g mask="url(#mask)"><g class="marks"></g><path class="g"/></g>
    <g class="light" mask="url(#light-mask)"></g>
    <g class="c">
      <polygon class="f"/><polygon class="f"/><polygon class="f"/>
      <polygon class="absorb"/><polygon class="absorb"/><polygon class="absorb"/>
      <polygon class="s"/>
      <ellipse class="e" rx="1" ry="1"/><ellipse class="e" rx="1" ry="1"/>
    </g>
  </svg>
  <p class="code">404</p>
  <h1 class="title">This page rolled away</h1>
  <p class="lede">There’s almost nothing to see here.</p>
  <p class="count" aria-hidden="true"></p>
  <a class="button" href="/"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg><span>Back home</span></a>
</main>
<script>
(() => {
  // The cube rolls edge over edge: before each roll it leans back a little, then tips over its front edge gathering
  // speed like a real fall, and lands with a small squash. The ground slides back under it, so it stays in the middle.
  // Its eyes show where it's looking (the pointer, you, or ahead).
  const COS = Math.cos(Math.PI / 6);
  // Isometric: a ground point and height to the drawing. `ground` is its inverse, so change them together.
  const P = (x, y, z) => [(x - y) * COS, (x + y) / 2 - z];
  const pts = (a) => a.map(([x, y]) => `${x.toFixed(2)},${y.toFixed(2)}`).join(' ');
  const S = 12, H = S / 2; // the cube's side, and half of it
  const MOVE = 1050, HOLD = 280; // ms: one roll, then a rest on the new cell
  const SQUASH = 600; // ms the landing's squash rings for
  const R = 14 * S; // how far the grid runs; the mask fades it well before
  const TRAIL = 120, FADE = 30; // squares kept marked, and how many of the oldest fade out
  const DEG = Math.PI / 180;
  const REST = 3000; // ms it waits after arriving or being stopped, unless the pointer moves first
  const VISIBLE = 0.8; // how far out, as a share of the grid's fade, a square can still be marked
  // The intro: the grid spreads out from the cube's square; the cube falls in, lands, opens its eyes, looks round.
  const SPREAD = 1600, DROP = 380, FALL = 560, WAKE = 1000, LAND = DROP + FALL;

  // The frame: five cells round the cube at its tallest, at 16:10.
  const VIEW = (() => {
    const c = [];
    for (const x of [-5 * S, 5 * S]) for (const y of [-5 * S, 5 * S]) for (const z of [0, S * 1.42]) c.push(P(x, y, z));
    const xs = c.map((p) => p[0]), ys = c.map((p) => p[1]);
    const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
    const w = Math.max((Math.max(...xs) - Math.min(...xs)) * 1.15, (Math.max(...ys) - Math.min(...ys)) * 1.15 * 16 / 10), h = w * 10 / 16;
    const r = (v) => Math.round(v * 10) / 10;
    return { x: r(cx - w / 2), y: r(cy - h / 2), w: r(w), h: r(h) };
  })();

  // Corners are indexed x*4 + y*2 + z (each 0 or 1); the six faces, with their normals before it turns.
  const FACES = [
    [[0, 1, 3, 2], [-1, 0, 0]], [[4, 6, 7, 5], [1, 0, 0]], [[0, 4, 5, 1], [0, -1, 0]],
    [[2, 3, 7, 6], [0, 1, 0]], [[0, 2, 6, 4], [0, 0, -1]], [[1, 5, 7, 3], [0, 0, 1]],
  ];

  function hull(p) {
    p = [...p].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const half = (q) => {
      const h = [];
      for (const v of q) { while (h.length > 1 && cr(h[h.length - 2], h[h.length - 1], v) <= 0) h.pop(); h.push(v); }
      return h.slice(0, -1);
    };
    return [...half(p), ...half([...p].reverse())];
  }

  const clamp = (x) => Math.min(1, Math.max(0, x));
  const inOut = (x) => (x = clamp(x), x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
  const expoOut = (x) => (x >= 1 ? 1 : 1 - 2 ** (-10 * clamp(x)));

  // The roll's angle at u (0 to 1): a lean back to -6°, a breath back upright, then over the front edge, speeding up.
  function angle(u) {
    if (u < 0.22) return -6 * DEG * (1 - (1 - u / 0.22) ** 2);
    if (u < 0.34) return -6 * DEG * (1 - inOut((u - 0.22) / 0.12));
    return (Math.PI / 2) * clamp((u - 0.34) / 0.66) ** 2;
  }
  const squash = (age, amp = 0.11) => 1 - amp * Math.exp(-age / 111) * Math.cos(age / 45);

  const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const unit = (a) => { const l = Math.hypot(...a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

  // The eyes: two dots on the side face turned most toward `slot` (the right face or the left), kept level however
  // the face tilts, shifted toward where they look. As the face tips away they shrink; on the next one they grow back.
  const RIGHT = [1, 0, 0], LEFT = [0, 1, 0], UP = [0, 0, 1];
  const EYE_W = 0.065 * S, EYE_H = 0.105 * S, EYE_GAP = 0.2 * S;
  const EYE_CLEAR = 0.05 * S; // the least they stay inside the face's edge
  const EYE_LOOK = H - EYE_GAP / 2 - EYE_W - EYE_CLEAR;

  // The drawing for a roll toward `d` at angle `th`, with the landing's squash `sq` (1: none), and the eyes.
  function pose(th, d, sq, eyes, look) {
    const c = Math.cos(th), s = Math.sin(th);
    const k = clamp(th / (Math.PI / 2)); // the ground slides back as it falls, never as it leans
    const sx = -S * k * d[0], sy = -S * k * d[1];
    const pa = th < 0 ? -H : H; // it leans on its back edge and falls over its front one
    const spin = (x, y, z, p = pa) => {
      const a = x * d[0] + y * d[1], b = -x * d[1] + y * d[0], ra = a - p;
      const A = p + ra * c + z * s, Z = -ra * s + z * c;
      return [A * d[0] - b * d[1], A * d[1] + b * d[0], Z];
    };
    const wide = Math.sqrt(2 - sq);
    const at = (p) => P(p[0] * wide + sx, p[1] * wide + sy, p[2] * sq);
    const v = [];
    for (const x of [-H, H]) for (const y of [-H, H]) for (const z of [0, S]) v.push(at(spin(x, y, z)));
    const normals = FACES.map(([, n]) => spin(n[0], n[1], n[2], 0));
    const shown = FACES.map((_, i) => i).filter((i) => normals[i][0] + normals[i][1] + normals[i][2] > 0.01);
    const faces = shown.map((i) => pts(FACES[i][0].map((j) => v[j])));
    let grid = '';
    const line = (p, q) => { grid += `M${p[0].toFixed(1)} ${p[1].toFixed(1)}L${q[0].toFixed(1)} ${q[1].toFixed(1)}`; };
    const first = (o) => H + o - Math.floor((H + o + R) / S) * S;
    for (let g = first(sx); g <= R; g += S) line(P(g, -R, 0), P(g, R, 0));
    for (let g = first(sy); g <= R; g += S) line(P(-R, g, 0), P(R, g, 0));

    // The eyes' face, how squarely it faces the slot (1 at rest), and its level axes: u across, w up.
    const e = eyes.slot;
    const N = normals.reduce((m, n) => (dot(n, e) > dot(m, e) ? n : m));
    const sqr = dot(N, e);
    const acr = cross(UP, N), u = unit(Math.hypot(...acr) > 0.2 ? acr : cross(UP, e));
    const w = cross(N, u);
    const mid = spin(0, 0, H), face = [mid[0] + N[0] * H, mid[1] + N[1] * H, mid[2] + N[2] * H];
    // Where the eyes want to look, as a shift across and up the face; all the way over from a cell and a half off.
    const lin = (p) => P(p[0] * wide, p[1] * wide, p[2] * sq);
    let want = [0, 0.35];
    if (look) {
      const f = at(face), t = P(look[0], look[1], look[2]), U = lin(u), W = lin(w);
      const dx = t[0] - f[0], dy = t[1] - f[1], det = U[0] * W[1] - U[1] * W[0];
      if (Math.abs(det) > 1e-3) {
        const a = (dx * W[1] - dy * W[0]) / det, b = (U[0] * dy - U[1] * dx) / det, m = Math.hypot(a, b) || 1;
        const reach = Math.min(1, m / (1.5 * S));
        want = [(a / m) * reach, (b / m) * reach];
      }
    }
    const g = clamp((sqr - 0.72) / 0.22), size = Math.max(0, eyes.open) * g * g * (3 - 2 * g);
    // Where they sit, off the face's middle. The eyes stay level as the face tilts, so what keeps them on it is measured
    // along its own edges: each way, the pair may shift as far as leaves both a hair inside.
    const gm = Math.max(1, Math.hypot(...eyes.gaze)), su = (eyes.gaze[0] / gm) * EYE_LOOK, sw = 0.06 * S + (eyes.gaze[1] / gm) * EYE_LOOK;
    const shift = [0, 0, 0];
    for (const i of [0, 2, 4]) {
      if (i === (normals.indexOf(N) & ~1)) continue;
      const a = normals[i], au = dot(u, a), aw = dot(w, a);
      const room = H - EYE_CLEAR * (1 + 5 * (1 - sqr)) - Math.hypot(EYE_W * au, EYE_H * aw) - (EYE_GAP / 2) * Math.abs(au); // more as it tilts away
      const along = Math.max(-room, Math.min(room, su * au + sw * aw));
      for (const j of [0, 1, 2]) shift[j] += a[j] * along;
    }
    const eye = (side) => {
      const du = (side * EYE_GAP) / 2;
      const o = at([face[0] + shift[0] + u[0] * du, face[1] + shift[1] + u[1] * du, face[2] + shift[2] + u[2] * du]);
      const a = lin([u[0] * EYE_W * size, u[1] * EYE_W * size, u[2] * EYE_W * size]);
      const lh = EYE_H * size * eyes.lid, b = lin([w[0] * lh, w[1] * lh, w[2] * lh]);
      return size < 0.01 ? 'scale(0)' : `matrix(${[a[0], a[1], b[0], b[1], o[0], o[1]].map((x) => x.toFixed(3)).join(' ')})`;
    };
    return { faces, outline: pts(hull(v)), grid, sx, sy, eyes: [eye(-1), eye(1)], square: sqr, want };
  }

  // The light on the chosen square: a long-exposure ribbon running round its grid lines. SVG can't grade a fill along a
  // curve, so the fade is a mask of opaque greys, which overlap without seams.
  const LAP = 1700, LIT = 700, OUT = 340; // ms: once round, the tail growing out, and the light going out
  const TAIL = 0.88, RUSH = 0.55; // the tail's share of the loop, and the extra laps of the quick start
  const HEAD_W = 0.35, TAIL_W = 0.1; // half the ribbon's width, in the cube's units
  const LEVELS = 48, LOOP = (() => {
    const a = H, r = 0.5, side = 2 * (a - r), arc = (Math.PI / 2) * r, n = 240;
    return Array.from({ length: n }, (_, i) => {
      // Along a side and round its corner, from the top of the square clockwise as drawn; then the same, quarter-turned.
      const s = (i / n) * 4 * (side + arc), q = Math.floor(s / (side + arc)), o = s - q * (side + arc);
      const th = (Math.max(0, o - side) / arc) * (Math.PI / 2);
      const u = o < side ? -(a - r) + o : a - r + r * Math.sin(th), v = o < side ? -a : -(a - r) - r * Math.cos(th);
      return [[u, v], [-v, u], [-u, -v], [v, -u]][q];
    });
  })();

    if (!document.hidden && loaded) raf = requestAnimationFrame(frame);
  });
})();
</script>
<noscript><style>.intro-wait .cube { display: none; } .intro-wait main > :not(.cube) { animation: none; }</style></noscript>
